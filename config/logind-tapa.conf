# Ruta: /etc/systemd/logind.conf.d/tapa.conf
#
# El servidor es un portátil que funcionará con la tapa cerrada.
# Por defecto systemd-logind suspende el equipo al cerrarla, lo que
# dejaría el servidor inaccesible. Se le indica que no haga nada.
#
# Aplicar cambios: sudo systemctl restart systemd-logind
# (puede cerrar la sesión gráfica/local; por SSH no afecta)

[Login]
# Tapa cerrada con batería
HandleLidSwitch=ignore
# Tapa cerrada con el cargador conectado
HandleLidSwitchExternalPower=ignore
# Tapa cerrada con el equipo en una base/dock
HandleLidSwitchDocked=ignore
