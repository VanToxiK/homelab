# Ruta: /etc/ssh/sshd_config.d/10-seguridad.conf
#
# Endurecimiento de SSH. Debian incluye los ficheros de sshd_config.d/
# desde /etc/ssh/sshd_config; el prefijo "10-" hace que se lea pronto
# (en sshd gana la PRIMERA directiva encontrada, así que el orden importa).
#
# IMPORTANTE: antes de aplicar, comprobar que el acceso por clave
# funciona desde otra sesión, o te quedarás fuera del servidor.
#
# Validar sintaxis:  sudo sshd -t
# Aplicar:           sudo systemctl reload ssh

# Desactiva la autenticación por contraseña: solo se admite clave pública.
PasswordAuthentication no

# Desactiva el método "keyboard-interactive" (otra vía de contraseña por PAM).
KbdInteractiveAuthentication no

# Prohíbe el inicio de sesión directo como root.
PermitRootLogin no
